<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Navigation OMS</title>
	<!-- CSS Bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Fichier CSS personnalisé -->
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- Bandeau de navigation -->
	<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
		<div class="container-fluid px-4">

			<!-- Logo OMS à gauche -->
			<a class="navbar-brand" href="#">
				<img src="img/logo.jpg" alt="Logo OMS" class="navbar-logo">
			</a>

			<!-- Bouton Hamburger (Mobile) -->
			<button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<!-- Liens de navigation centrés sur la page -->
			<div class="collapse navbar-collapse" id="navbarContent">
				<ul class="navbar-nav mx-auto mb-2 mb-lg-0">
					<li class="nav-item">
						<a class="nav-link active-link" href="#">Accueil</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="#">Photo</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="#">Présentation</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="#">Activités</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="#">Contact</a>
					</li>
				</ul>
			</div>

		</div>
	</nav>

	<!-- JS Bootstrap (Obligatoire pour l'ouverture du menu mobile) -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
